<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storyphilium — Сценарный редактор</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #eef3ed;
            --bg-surface: #f7faf6;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-input-focus: #fafffa;
            --accent: #5b8c5a;
            --accent-hover: #4a7549;
            --accent-border: #b3d0b0;
            --accent-light: #d8e8d6;
            --text-primary: #1e2f1c;
            --text-secondary: #3d553a;
            --text-light: #6a8765;
            --shadow-soft: 0 4px 24px rgba(91, 140, 90, 0.10);
            --shadow-hover: 0 12px 40px rgba(91, 140, 90, 0.16);
            --radius: 16px;
            --radius-sm: 10px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --script-font: 'Courier Prime', 'Courier New', monospace;
            --transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            --border-light: 1px solid rgba(179, 208, 176, 0.35);
        }

        [data-theme="dark"] {
            --bg-main: #1a281a;
            --bg-surface: #243024;
            --bg-card: #2d3d2d;
            --bg-input: #1e2e1e;
            --bg-input-focus: #2a3f2a;
            --accent: #8ab882;
            --accent-hover: #7ba373;
            --accent-border: #4a6a4a;
            --accent-light: #3a553a;
            --text-primary: #d4e6d0;
            --text-secondary: #a0c0a0;
            --text-light: #80a080;
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
            --border-light: 1px solid rgba(74, 106, 74, 0.4);
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font);
            background: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            padding: 14px 18px 0;
            transition: background 0.4s, color 0.4s;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(91, 140, 90, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(91, 140, 90, 0.03) 0%, transparent 50%);
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 20px;
        }

        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: var(--bg-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
            margin-bottom: 10px;
            border: var(--border-light);
            flex-shrink: 0;
            transition: all 0.4s;
            gap: 8px;
        }

        .app-header .brand {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .app-header .brand .story {
            font-size: 18px;
            letter-spacing: -0.3px;
        }
        .app-header .brand .separator {
            color: var(--accent-border);
            font-weight: 300;
        }
        .app-header .brand .family {
            font-size: 20px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .app-header .header-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ===== PROJECTS DROPDOWN ===== */
        .project-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .project-selector select {
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            border: var(--border-light);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 500;
            max-width: 140px;
            cursor: pointer;
            outline: none;
        }
        .project-selector select:focus {
            border-color: var(--accent);
        }
        .project-selector .project-actions {
            display: flex;
            gap: 4px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: var(--font);
            font-weight: 600;
            font-size: 12px;
            padding: 6px 14px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.2px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid transparent;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 12px rgba(91, 140, 90, 0.2);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(91, 140, 90, 0.25);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: var(--border-light);
        }
        .btn-secondary:hover {
            background: var(--bg-main);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: var(--border-light);
        }
        .btn-outline:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: #e8d0d0;
            color: #5a3a3a;
        }
        .btn-danger:hover {
            background: #ddc0c0;
            transform: translateY(-1px);
        }
        .btn-sm {
            font-size: 10px;
            padding: 4px 10px;
        }
        .btn-icon {
            font-size: 15px;
            padding: 6px 10px;
            min-width: 34px;
        }
        .btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ===== TOOLBAR ===== */
        .editor-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 6px 16px;
            background: var(--bg-surface);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-bottom: var(--border-light);
            flex-shrink: 0;
            transition: all 0.4s;
            flex-wrap: wrap;
        }
        .editor-toolbar .toolbar-group {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .editor-toolbar .toolbar-group .group-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-right: 4px;
            font-weight: 600;
        }
        .editor-toolbar .toolbar-btn {
            background: transparent;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            font-family: var(--font);
        }
        .editor-toolbar .toolbar-btn:hover {
            background: var(--accent-light);
            color: var(--text-primary);
        }
        .editor-toolbar .toolbar-btn.active {
            background: var(--accent);
            color: #fff;
        }
        .editor-toolbar .spacer {
            flex: 1;
        }
        .editor-toolbar .stats {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .editor-toolbar .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .editor-toolbar .stats .num {
            font-weight: 700;
            color: var(--accent);
            min-width: 16px;
        }
        .editor-toolbar .status-indicator {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .editor-toolbar .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            transition: all 0.3s;
        }
        .editor-toolbar .status-dot.saving {
            background: #f0c040;
            animation: pulse 0.6s ease-in-out 3;
        }
        .editor-toolbar .status-dot.saved {
            background: var(--accent);
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.4);
                opacity: 0.5;
            }
        }

        /* ===== EDITOR ===== */
        .editor-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            border-radius: 0 0 var(--radius) var(--radius);
            overflow: hidden;
            background: var(--bg-surface);
            box-shadow: var(--shadow-soft);
            border: var(--border-light);
            border-top: none;
            position: relative;
        }

        .editor-wrapper textarea {
            flex: 1;
            width: 100%;
            padding: 1.6cm 2.2cm;
            font-family: var(--script-font);
            font-size: 13pt;
            line-height: 1.85;
            color: var(--text-primary);
            background: var(--bg-input);
            border: none;
            outline: none;
            resize: none;
            transition: background 0.3s, padding 0.4s, font-size 0.4s;
            letter-spacing: 0.15px;
            tab-size: 4;
        }
        .editor-wrapper textarea:focus {
            background: var(--bg-input-focus);
        }
        .editor-wrapper textarea::placeholder {
            color: var(--text-light);
            opacity: 0.35;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 400;
        }

        /* ===== FIND/REPLACE BAR ===== */
        .find-replace-bar {
            display: none;
            padding: 8px 16px;
            background: var(--bg-surface);
            border-top: var(--border-light);
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
        }
        .find-replace-bar.open {
            display: flex;
        }
        .find-replace-bar input {
            padding: 4px 10px;
            border: var(--border-light);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 12px;
            min-width: 120px;
        }
        .find-replace-bar input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .find-replace-bar .fr-label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .find-replace-bar .fr-actions {
            display: flex;
            gap: 4px;
        }

        /* ===== FOOTER ===== */
        .app-footer {
            flex-shrink: 0;
            padding: 6px 24px;
            margin-top: 10px;
            background: var(--bg-surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            border: var(--border-light);
            transition: all 0.4s;
        }
        .app-footer .copy {
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .app-footer .copy .family {
            font-weight: 400;
            color: var(--text-secondary);
        }
        .app-footer .copy .separator {
            color: var(--accent-border);
        }
        .app-footer .footer-right {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .app-footer .footer-right .timer {
            color: var(--text-light);
            font-variant-numeric: tabular-nums;
        }

        .hotkeys-hint {
            font-size: 10px;
            color: var(--text-light);
            opacity: 0.6;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hotkeys-hint kbd {
            background: var(--bg-card);
            padding: 1px 7px;
            border-radius: 4px;
            border: var(--border-light);
            font-size: 9px;
            font-family: var(--font);
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ===== FOCUS MODE ===== */
        body.focus-mode .app-header,
        body.focus-mode .app-footer,
        body.focus-mode .editor-toolbar {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        body.focus-mode .editor-wrapper textarea {
            padding: 2cm 3cm;
            font-size: 15pt;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .app-header .brand .family {
                font-size: 18px;
            }
            .app-header .brand .story {
                font-size: 16px;
            }
            .editor-wrapper textarea {
                padding: 1.4cm 1.8cm;
                font-size: 12.5pt;
            }
            .editor-toolbar .stats {
                font-size: 11px;
                gap: 10px;
            }
            .project-selector select {
                max-width: 120px;
                font-size: 11px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 8px 10px 0;
            }
            .app-header {
                padding: 8px 12px;
                gap: 6px;
            }
            .app-header .brand {
                font-size: 13px;
            }
            .app-header .brand .family {
                font-size: 16px;
            }
            .app-header .brand .story {
                font-size: 14px;
            }
            .btn {
                font-size: 10px;
                padding: 5px 10px;
            }
            .btn-icon {
                padding: 5px 8px;
                min-width: 30px;
                font-size: 13px;
            }
            .editor-wrapper textarea {
                padding: 1cm 1.2cm;
                font-size: 11.5pt;
            }
            .editor-toolbar {
                padding: 5px 10px;
                gap: 6px;
            }
            .editor-toolbar .stats {
                font-size: 10px;
                gap: 6px;
            }
            .editor-toolbar .toolbar-btn {
                font-size: 10px;
                padding: 3px 6px;
            }
            .app-footer {
                padding: 5px 12px;
                font-size: 10px;
                flex-direction: column;
                gap: 4px;
                text-align: center;
            }
            .hotkeys-hint {
                font-size: 9px;
                gap: 4px;
                justify-content: center;
            }
            body.focus-mode .editor-wrapper textarea {
                padding: 1.2cm 1.2cm;
                font-size: 13pt;
            }
            .find-replace-bar {
                padding: 6px 10px;
                font-size: 11px;
            }
            .find-replace-bar input {
                min-width: 80px;
                font-size: 11px;
            }
            .project-selector select {
                max-width: 100px;
                font-size: 10px;
                padding: 3px 6px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 4px 4px 0;
            }
            .app-header {
                padding: 6px 8px;
                border-radius: 12px;
            }
            .app-header .brand .family {
                font-size: 14px;
            }
            .app-header .brand .story {
                font-size: 12px;
            }
            .btn {
                font-size: 9px;
                padding: 4px 8px;
            }
            .btn-icon {
                padding: 4px 6px;
                min-width: 26px;
                font-size: 11px;
            }
            .editor-wrapper textarea {
                padding: 0.6cm 0.8cm;
                font-size: 10.5pt;
            }
            .editor-toolbar .stats {
                font-size: 9px;
                gap: 4px;
            }
            .editor-toolbar .toolbar-btn {
                font-size: 9px;
                padding: 2px 5px;
            }
            body.focus-mode .editor-wrapper textarea {
                padding: 0.8cm 0.8cm;
                font-size: 11pt;
            }
            .project-selector select {
                max-width: 80px;
                font-size: 9px;
                padding: 2px 4px;
            }
        }

        /* ===== PRINT ===== */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .app-header,
            .app-footer,
            .editor-toolbar,
            .find-replace-bar {
                display: none !important;
            }
            .editor-wrapper {
                border-radius: 0;
                box-shadow: none;
                border: none;
            }
            .editor-wrapper textarea {
                display: none !important;
            }
            .print-content {
                display: block !important;
                white-space: pre-wrap;
                font-family: 'Courier Prime', monospace;
                font-size: 12pt;
                padding: 2cm 2.5cm;
                line-height: 1.6;
                background: white;
                color: black;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="brand">
            <span class="story">STORYPHILIUM</span>
            <span class="separator">|</span>
            <span class="family">CINEPHILIUM FAMILY</span>
        </div>
        <div class="header-actions">
            <!-- Project Selector -->
            <div class="project-selector">
                <select id="projectSelect"></select>
                <div class="project-actions">
                    <button class="btn btn-secondary btn-sm" id="newProjectBtn" title="Новый проект">+</button>
                    <button class="btn btn-secondary btn-sm" id="deleteProjectBtn" title="Удалить проект">✕</button>
                </div>
            </div>
            <button class="btn btn-secondary btn-icon" id="themeToggle" title="Тема (Ctrl+T)">🌓</button>
            <button class="btn btn-secondary btn-icon" id="focusToggle" title="Фокус (Ctrl+F)">◎</button>
            <button class="btn btn-secondary btn-icon" id="findToggle" title="Поиск/Замена (Ctrl+H)">🔍</button>
            <button class="btn btn-secondary btn-sm" id="undoBtn" title="Отменить (Ctrl+Z)">↩</button>
            <button class="btn btn-secondary btn-sm" id="redoBtn" title="Повторить (Ctrl+Y)">↪</button>
            <button class="btn btn-primary btn-sm" id="exportTxtBtn">📄 Экспорт</button>
            <button class="btn btn-danger btn-sm" id="clearBtn">✕</button>
        </div>
    </header>

    <!-- TOOLBAR -->
    <div class="editor-toolbar" id="editorToolbar">
        <div class="toolbar-group">
            <span class="group-label">Вставка</span>
            <button class="toolbar-btn" data-insert="НАР">НАР</button>
            <button class="toolbar-btn" data-insert="ИНТ">ИНТ</button>
            <button class="toolbar-btn" data-insert="ЭКСТ">ЭКСТ</button>
            <button class="toolbar-btn" data-insert="ПЕРС">Персонаж</button>
            <button class="toolbar-btn" data-insert="ДИАЛ">Диалог</button>
            <button class="toolbar-btn" data-insert="РЕМ">Ремарка</button>
            <button class="toolbar-btn" data-insert="СЦЕНА">Сцена #</button>
        </div>
        <div class="spacer"></div>
        <div class="stats" id="statsBar">
            <span>📝 <span class="num" id="charCount">0</span></span>
            <span>📖 <span class="num" id="wordCount">0</span></span>
            <span>📃 <span class="num" id="lineCount">0</span></span>
            <span>📄 <span class="num" id="pageCount">0</span></span>
            <span>🎬 <span class="num" id="sceneCount">0</span></span>
            <span>👤 <span class="num" id="charactersCount">0</span></span>
            <span id="selectionStats" style="display:none;color:var(--accent);">
                ✦ <span class="num" id="selCharCount">0</span>
            </span>
        </div>
        <div class="status-indicator">
            <span class="status-dot saved" id="statusDot"></span>
            <span id="statusText">Сохранено</span>
        </div>
    </div>

    <!-- EDITOR -->
    <div class="editor-wrapper">
        <textarea id="scriptInput" placeholder="Начните писать сценарий…&#10;Используйте Ctrl+S для сохранения, Ctrl+E для экспорта" spellcheck="true"></textarea>
    </div>

    <!-- FIND/REPLACE BAR -->
    <div class="find-replace-bar" id="findReplaceBar">
        <span class="fr-label">Найти</span>
        <input type="text" id="findInput" placeholder="текст…" />
        <span class="fr-label">Заменить</span>
        <input type="text" id="replaceInput" placeholder="заменить…" />
        <div class="fr-actions">
            <button class="btn btn-secondary btn-sm" id="findNextBtn">Найти →</button>
            <button class="btn btn-secondary btn-sm" id="replaceBtn">Заменить</button>
            <button class="btn btn-secondary btn-sm" id="replaceAllBtn">Все</button>
        </div>
        <button class="btn btn-sm btn-outline" id="closeFindBtn">✕</button>
    </div>

    <!-- PRINT PLACEHOLDER -->
    <div class="print-content" style="display:none;"></div>

    <!-- FOOTER -->
    <footer class="app-footer">
        <span class="copy">
            STORYPHILIUM <span class="separator">|</span> <span class="family">CINEPHILIUM FAMILY</span> &copy; 2026
        </span>
        <div class="footer-right">
            <span class="timer" id="timerDisplay">⏱ 0:00:00</span>
            <span class="hotkeys-hint">
                <kbd>Ctrl+S</kbd> сохр <kbd>Ctrl+E</kbd> эксп <kbd>Ctrl+T</kbd> тема
                <kbd>Ctrl+F</kbd> фокус <kbd>Ctrl+H</kbd> поиск
            </span>
        </div>
    </footer>

    <script>
        (function() {
            'use strict';

            // ===== CONSTANTS =====
            const PROJECTS_KEY = 'storyphilium_pro_projects';
            const CURRENT_PROJECT_KEY = 'storyphilium_pro_current';
            const THEME_KEY = 'storyphilium_pro_theme';
            const FOCUS_KEY = 'storyphilium_pro_focus';
            const MAX_HISTORY = 60;

            // ===== DOM REFS =====
            const textarea = document.getElementById('scriptInput');
            const charCount = document.getElementById('charCount');
            const wordCount = document.getElementById('wordCount');
            const lineCount = document.getElementById('lineCount');
            const pageCount = document.getElementById('pageCount');
            const sceneCount = document.getElementById('sceneCount');
            const charactersCount = document.getElementById('charactersCount');
            const selCharCount = document.getElementById('selCharCount');
            const selectionStats = document.getElementById('selectionStats');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const timerDisplay = document.getElementById('timerDisplay');
            const exportBtn = document.getElementById('exportTxtBtn');
            const clearBtn = document.getElementById('clearBtn');
            const themeToggle = document.getElementById('themeToggle');
            const focusToggle = document.getElementById('focusToggle');
            const findToggle = document.getElementById('findToggle');
            const findReplaceBar = document.getElementById('findReplaceBar');
            const findInput = document.getElementById('findInput');
            const replaceInput = document.getElementById('replaceInput');
            const findNextBtn = document.getElementById('findNextBtn');
            const replaceBtn = document.getElementById('replaceBtn');
            const replaceAllBtn = document.getElementById('replaceAllBtn');
            const closeFindBtn = document.getElementById('closeFindBtn');
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            const projectSelect = document.getElementById('projectSelect');
            const newProjectBtn = document.getElementById('newProjectBtn');
            const deleteProjectBtn = document.getElementById('deleteProjectBtn');
            const printContent = document.querySelector('.print-content');

            // ===== STATE =====
            let saveTimer = null;
            let timerInterval = null;
            let startTime = Date.now();
            let elapsedSeconds = 0;
            let isDark = localStorage.getItem(THEME_KEY) === 'dark';
            let isFocus = localStorage.getItem(FOCUS_KEY) === 'true';

            // История для текущего проекта (хранится в памяти)
            let history = [];
            let historyIndex = -1;
            let isUndoRedo = false;

            // ===== PROJECTS MANAGEMENT =====
            function getProjects() {
                try {
                    const data = localStorage.getItem(PROJECTS_KEY);
                    return data ? JSON.parse(data) : {};
                } catch { return {}; }
            }

            function saveProjects(projects) {
                localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
            }

            function getCurrentProject() {
                return localStorage.getItem(CURRENT_PROJECT_KEY) || 'default';
            }

            function setCurrentProject(name) {
                localStorage.setItem(CURRENT_PROJECT_KEY, name);
            }

            function loadProject(name) {
                const projects = getProjects();
                const content = projects[name] || '';
                textarea.value = content;
                // Обновляем историю
                history = [content];
                historyIndex = 0;
                setCurrentProject(name);
                updateStats();
                saveScript(false);
                populateProjectSelect();
                projectSelect.value = name;
                statusText.textContent = `📁 ${name}`;
                setTimeout(() => { statusText.textContent = 'Сохранено'; }, 1500);
            }

            function saveCurrentProject() {
                const name = getCurrentProject();
                const projects = getProjects();
                projects[name] = textarea.value;
                saveProjects(projects);
            }

            function createProject() {
                const name = prompt('Введите название нового проекта:', 'Новый сценарий');
                if (!name || name.trim() === '') return;
                const cleanName = name.trim();
                const projects = getProjects();
                if (projects[cleanName] !== undefined) {
                    alert('Проект с таким названием уже существует!');
                    return;
                }
                projects[cleanName] = '';
                saveProjects(projects);
                loadProject(cleanName);
            }

            function deleteCurrentProject() {
                const name = getCurrentProject();
                if (name === 'default') {
                    alert('Нельзя удалить проект по умолчанию.');
                    return;
                }
                if (!confirm(`Удалить проект "${name}"? Это действие необратимо.`)) return;
                const projects = getProjects();
                delete projects[name];
                saveProjects(projects);
                // Переключаемся на default
                if (projects['default'] === undefined) {
                    projects['default'] = '';
                    saveProjects(projects);
                }
                loadProject('default');
            }

            function populateProjectSelect() {
                const projects = getProjects();
                const current = getCurrentProject();
                projectSelect.innerHTML = '';
                const names = Object.keys(projects);
                if (names.length === 0) {
                    // Создаём проект по умолчанию
                    projects['default'] = '';
                    saveProjects(projects);
                    names.push('default');
                }
                names.sort();
                for (const name of names) {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    if (name === current) option.selected = true;
                    projectSelect.appendChild(option);
                }
            }

            // ===== THEME =====
            function applyTheme(dark) {
                isDark = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                themeToggle.textContent = dark ? '☀️' : '🌓';
                localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
            }
            applyTheme(isDark);
            themeToggle.addEventListener('click', () => applyTheme(!isDark));

            // ===== FOCUS =====
            function applyFocus(focus) {
                isFocus = focus;
                document.body.classList.toggle('focus-mode', focus);
                focusToggle.textContent = focus ? '◉' : '◎';
                localStorage.setItem(FOCUS_KEY, focus ? 'true' : 'false');
            }
            applyFocus(isFocus);
            focusToggle.addEventListener('click', () => applyFocus(!isFocus));

            // ===== TIMER =====
            function updateTimer() {
                const total = Math.floor((Date.now() - startTime) / 1000) + elapsedSeconds;
                const h = String(Math.floor(total / 3600)).padStart(2, '0');
                const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
                const s = String(total % 60).padStart(2, '0');
                timerDisplay.textContent = `⏱ ${h}:${m}:${s}`;
            }

            function startTimer() {
                startTime = Date.now();
                clearInterval(timerInterval);
                timerInterval = setInterval(updateTimer, 1000);
                updateTimer();
            }
            startTimer();

            // ===== HISTORY =====
            function pushHistory() {
                if (isUndoRedo) return;
                const current = textarea.value;
                if (history.length > 0 && history[historyIndex] === current) return;
                history = history.slice(0, historyIndex + 1);
                history.push(current);
                if (history.length > MAX_HISTORY) {
                    history.shift();
                }
                historyIndex = history.length - 1;
            }

            function undo() {
                if (historyIndex <= 0) return;
                isUndoRedo = true;
                historyIndex--;
                textarea.value = history[historyIndex];
                textarea.dispatchEvent(new Event('input'));
                isUndoRedo = false;
                updateStats();
            }

            function redo() {
                if (historyIndex >= history.length - 1) return;
                isUndoRedo = true;
                historyIndex++;
                textarea.value = history[historyIndex];
                textarea.dispatchEvent(new Event('input'));
                isUndoRedo = false;
                updateStats();
            }

            // ===== STATS =====
            function updateStats() {
                const text = textarea.value;
                const chars = text.length;
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                const lines = text ? text.split('\n').length : 0;
                const pages = Math.max(1, Math.ceil(chars / 1000));

                // Сцены: строки начинающиеся с НАР., ИНТ., ЭКСТ. (регистронезависимо)
                const sceneMatches = text.match(/^(НАР\.|ИНТ\.|ЭКСТ\.|NAR\.|INT\.|EXT\.)/gim);
                const scenes = sceneMatches ? sceneMatches.length : 0;

                // Персонажи: строки с именем в верхнем регистре (не диалог, не ремарка)
                const linesArr = text.split('\n');
                let charNames = new Set();
                for (let line of linesArr) {
                    const trimmed = line.trim();
                    if (trimmed.length > 0 && trimmed === trimmed.toUpperCase() &&
                        !trimmed.startsWith('НАР.') && !trimmed.startsWith('ИНТ.') && !trimmed.startsWith('ЭКСТ.') &&
                        !trimmed.startsWith('NAR.') && !trimmed.startsWith('INT.') && !trimmed.startsWith('EXT.') &&
                        !trimmed.startsWith('(') && !trimmed.startsWith('[') &&
                        !trimmed.match(/^\d+\./) && !trimmed.match(/^[А-ЯA-Z\s\-']+$/)) {
                        charNames.add(trimmed);
                    }
                }

                charCount.textContent = chars;
                wordCount.textContent = words;
                lineCount.textContent = lines;
                pageCount.textContent = pages;
                sceneCount.textContent = scenes;
                charactersCount.textContent = charNames.size;

                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                if (start !== end) {
                    const sel = text.substring(start, end);
                    selCharCount.textContent = sel.length;
                    selectionStats.style.display = 'inline';
                } else {
                    selectionStats.style.display = 'none';
                }
            }

            // ===== SAVE =====
            function saveScript(showFeedback = true) {
                const val = textarea.value;
                saveCurrentProject();
                if (showFeedback) {
                    statusDot.className = 'status-dot saved';
                    statusText.textContent = 'Сохранено';
                    setTimeout(() => {
                        statusDot.className = 'status-dot saved';
                    }, 2000);
                }
                pushHistory();
                updateStats();
            }

            function triggerAutoSave() {
                clearTimeout(saveTimer);
                statusDot.className = 'status-dot saving';
                statusText.textContent = 'Сохранение…';
                saveTimer = setTimeout(() => saveScript(true), 1000);
            }

            // ===== LOAD =====
            function loadDefaultScript() {
                // Пример сценария на русском сценарном языке
                return `НАР. КВАРТИРА ИВАНА - ДЕНЬ

        Иван сидит на диване, смотрит в стену. За окном шумят машины.

        ИВАН
        (вздыхая)
        Опять этот кошмар. Сколько можно?

        Он встаёт, подходит к окну.

        ИНТ. КАФЕ "У КОФЕЙНИ" - УТРО

        В кафе тихо играет джаз. Ольга и Дмитрий сидят за столиком у окна.

        ОЛЬГА
        Ты сегодня какой-то задумчивый.

        ДМИТРИЙ
        Просто мысли. Много мыслей.

        Ольга помешивает кофе, смотрит на Дмитрия.

        ОЛЬГА
        Рассказывай. Я слушаю.

        ДМИТРИЙ
        (пауза)
        Не знаю, с чего начать.

        ИНТ. ОФИС - ДЕНЬ

        Андрей печатает на клавиатуре. Входит Наталья.

        НАТАЛЬЯ
        Андрей, проект готов?

        АНДРЕЙ
        Почти. Ещё пара штрихов.

        НАТАЛЬЯ
        Хорошо. Жду.`;
            }

            function initProjects() {
                let projects = getProjects();
                if (Object.keys(projects).length === 0) {
                    projects['default'] = loadDefaultScript();
                    saveProjects(projects);
                }
                populateProjectSelect();
                const current = getCurrentProject();
                if (!projects[current]) {
                    setCurrentProject('default');
                }
                const content = projects[getCurrentProject()] || '';
                textarea.value = content;
                history = [content];
                historyIndex = 0;
                updateStats();
                saveScript(false);
                projectSelect.value = getCurrentProject();
            }

            // ===== EXPORT =====
            function exportTxt() {
                const content = textarea.value;
                if (!content.trim()) {
                    alert('Сценарий пуст. Нечего экспортировать.');
                    return;
                }
                const now = new Date();
                const dateStr =
                    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
                const projectName = getCurrentProject();
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${projectName}_${dateStr}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                statusText.textContent = '✅ Экспортировано!';
                setTimeout(() => { statusText.textContent = 'Сохранено'; }, 2000);
            }

            // ===== CLEAR =====
            function clearScript() {
                if (textarea.value.trim() === '') return;
                if (!confirm('Удалить весь текст сценария без возможности восстановления?')) return;
                textarea.value = '';
                saveScript(true);
                textarea.focus();
                updateStats();
            }

            // ===== FIND / REPLACE =====
            let lastFindIndex = -1;

            function findNext() {
                const query = findInput.value;
                if (!query) return;
                const text = textarea.value;
                const start = textarea.selectionEnd;
                let idx = text.indexOf(query, start);
                if (idx === -1) {
                    idx = text.indexOf(query);
                }
                if (idx === -1) {
                    statusText.textContent = '❌ Не найдено';
                    setTimeout(() => { statusText.textContent = 'Сохранено'; }, 1500);
                    return;
                }
                textarea.setSelectionRange(idx, idx + query.length);
                textarea.focus();
                lastFindIndex = idx;
            }

            function replaceCurrent() {
                const query = findInput.value;
                const replacement = replaceInput.value;
                if (!query) return;
                const text = textarea.value;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                if (start === end || text.substring(start, end) !== query) {
                    findNext();
                    return;
                }
                const before = text.substring(0, start);
                const after = text.substring(end);
                textarea.value = before + replacement + after;
                const newPos = start + replacement.length;
                textarea.setSelectionRange(newPos, newPos);
                textarea.dispatchEvent(new Event('input'));
                triggerAutoSave();
                updateStats();
            }

            function replaceAll() {
                const query = findInput.value;
                const replacement = replaceInput.value;
                if (!query) return;
                const text = textarea.value;
                const newText = text.split(query).join(replacement);
                if (newText !== text) {
                    textarea.value = newText;
                    textarea.dispatchEvent(new Event('input'));
                    triggerAutoSave();
                    updateStats();
                    statusText.textContent = `✅ Заменено ${(text.length - newText.length) / query.length}`;
                    setTimeout(() => { statusText.textContent = 'Сохранено'; }, 2000);
                } else {
                    statusText.textContent = '❌ Ничего не найдено';
                    setTimeout(() => { statusText.textContent = 'Сохранено'; }, 1500);
                }
            }

            // ===== INSERT ELEMENTS (Русский сценарный язык) =====
            function insertElement(type) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const text = textarea.value;
                const before = text.substring(0, start);
                const after = text.substring(end);
                let insert = '';
                let cursorOffset = 0;

                switch (type) {
                    case 'НАР':
                        insert = 'НАР.  - ДЕНЬ\n\n';
                        cursorOffset = insert.length;
                        break;
                    case 'ИНТ':
                        insert = 'ИНТ.  - ДЕНЬ\n\n';
                        cursorOffset = insert.length;
                        break;
                    case 'ЭКСТ':
                        insert = 'ЭКСТ.  - ДЕНЬ\n\n';
                        cursorOffset = insert.length;
                        break;
                    case 'ПЕРС':
                        insert = '\n\nПЕРСОНАЖ\n';
                        cursorOffset = insert.length;
                        break;
                    case 'ДИАЛ':
                        insert = '\n(диалог)\n';
                        cursorOffset = insert.length;
                        break;
                    case 'РЕМ':
                        insert = '\n(ремарка)\n';
                        cursorOffset = insert.length;
                        break;
                    case 'СЦЕНА':
                        const sceneNum = (textarea.value.match(/^(\d+)\./gm) || []).length + 1;
                        insert = `\n${sceneNum}.  \n\n`;
                        cursorOffset = insert.length;
                        break;
                    default:
                        return;
                }

                textarea.value = before + insert + after;
                const newPos = start + cursorOffset;
                textarea.setSelectionRange(newPos, newPos);
                textarea.focus();
                textarea.dispatchEvent(new Event('input'));
                triggerAutoSave();
                updateStats();
            }

            // ===== EVENTS =====
            textarea.addEventListener('input', function() {
                triggerAutoSave();
                updateStats();
            });

            textarea.addEventListener('blur', function() {
                clearTimeout(saveTimer);
                saveScript(true);
            });

            textarea.addEventListener('select', updateStats);
            textarea.addEventListener('click', updateStats);

            // ===== TOOLBAR BUTTONS =====
            document.querySelectorAll('[data-insert]').forEach(btn => {
                btn.addEventListener('click', () => insertElement(btn.dataset.insert));
            });

            // ===== PROJECT EVENTS =====
            projectSelect.addEventListener('change', function() {
                const name = this.value;
                if (name) {
                    // Сохраняем текущий проект перед переключением
                    saveCurrentProject();
                    loadProject(name);
                }
            });

            newProjectBtn.addEventListener('click', createProject);
            deleteProjectBtn.addEventListener('click', deleteCurrentProject);

            // ===== FIND TOGGLE =====
            findToggle.addEventListener('click', () => {
                findReplaceBar.classList.toggle('open');
                if (findReplaceBar.classList.contains('open')) {
                    findInput.focus();
                }
            });
            closeFindBtn.addEventListener('click', () => {
                findReplaceBar.classList.remove('open');
            });
            findNextBtn.addEventListener('click', findNext);
            replaceBtn.addEventListener('click', replaceCurrent);
            replaceAllBtn.addEventListener('click', replaceAll);
            findInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    findNext(); } });
            replaceInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    replaceCurrent(); } });

            // ===== UNDO / REDO =====
            undoBtn.addEventListener('click', undo);
            redoBtn.addEventListener('click', redo);

            // ===== KEYBOARD SHORTCUTS =====
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveScript(true);
                    statusText.textContent = '✅ Сохранено!';
                    setTimeout(() => { statusText.textContent = 'Сохранено'; }, 1500);
                    return;
                }
                if (e.ctrlKey && e.key === 'e') {
                    e.preventDefault();
                    exportTxt();
                    return;
                }
                if (e.ctrlKey && e.key === 't') {
                    e.preventDefault();
                    applyTheme(!isDark);
                    return;
                }
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    applyFocus(!isFocus);
                    return;
                }
                if (e.ctrlKey && e.key === 'h') {
                    e.preventDefault();
                    findReplaceBar.classList.toggle('open');
                    if (findReplaceBar.classList.contains('open')) {
                        findInput.focus();
                        findInput.select();
                    }
                    return;
                }
                if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undo();
                    return;
                }
                if (e.ctrlKey && e.key === 'y') {
                    e.preventDefault();
                    redo();
                    return;
                }
                if (e.ctrlKey && e.shiftKey && e.key === 'Z') {
                    e.preventDefault();
                    redo();
                    return;
                }
                // Ctrl+1..7 для вставки на русском
                if (e.ctrlKey && !e.shiftKey && e.key >= '1' && e.key <= '7') {
                    e.preventDefault();
                    const map = {
                        '1': 'НАР',
                        '2': 'ИНТ',
                        '3': 'ЭКСТ',
                        '4': 'ПЕРС',
                        '5': 'ДИАЛ',
                        '6': 'РЕМ',
                        '7': 'СЦЕНА'
                    };
                    insertElement(map[e.key]);
                    return;
                }
            });

            // ===== EXPORT & CLEAR BUTTONS =====
            exportBtn.addEventListener('click', exportTxt);
            clearBtn.addEventListener('click', clearScript);

            // ===== INIT =====
            initProjects();

            // Сохраняем при закрытии
            window.addEventListener('beforeunload', function() {
                saveCurrentProject();
            });

            console.log('📝 Storyphilium — сценарный редактор на русском языке');
            console.log('📁 Поддержка множества проектов');
            console.log('⌨️  Ctrl+1..7 — НАР, ИНТ, ЭКСТ, персонаж, диалог, ремарка, сцена');

        })();
    </script>

</body>
</html>
